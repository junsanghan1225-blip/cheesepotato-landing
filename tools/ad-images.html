<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<!-- 구글 애즈에 올릴 그림의 판. tools/build-ad-images.mjs 가 이 쪽을 열어
     칸마다 사진을 찍는다. 손으로 열어 봐도 된다 — 그대로 보인다.

     **글자를 안 넣는다.** 문구는 캔바에서 얹기로 했다. 여기서 굽는 것은
     바탕과 마스코트뿐이고, 그래서 어느 지면에 잘려 나가도 말이 깨질 것이
     없다. 마스코트만 따로 뽑은 투명 png(mascots.png)도 같이 나온다 —
     캔바에서는 그쪽을 쓰면 바탕을 마음대로 고를 수 있다.

     ※ 주소는 저장소 뿌리에서 본 것이다. 뿌리에서 서버를 띄우고
       /tools/ad-images.html 로 열어야 로고가 붙는다. -->
<style>
:root{--bg:#F2EEE4;--tint:#FDF0E2;--ink:#1B1512;--orange:#FF914D}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888}
.shot{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.shot img{display:block}

/* 마스코트를 가운데에 넉넉한 여백과 함께 둔다. 구글은 이 그림을 지면에
   맞춰 제멋대로 잘라 쓰므로, 가장자리에 붙여 두면 발이 잘린다. */
#land{width:1200px;height:628px}      #land  img{height:480px}
#sq{width:1200px;height:1200px}       #sq    img{width:820px}
#port{width:960px;height:1200px}      #port  img{width:720px}
#logo1{width:1200px;height:1200px}    #logo1 img{width:940px}
#logo4{width:1200px;height:300px}     #logo4 img{height:232px}
</style></head><body>

<div class="shot" id="land"><img class="mascot" alt=""></div>
<div class="shot" id="sq"><img class="mascot" alt=""></div>
<div class="shot" id="port"><img class="mascot" alt=""></div>
<div class="shot" id="logo1"><img class="mascot" alt=""></div>
<div class="shot" id="logo4"><img class="mascot" alt=""></div>

<script src="/tools/ad-images-cutout.js"></script>
</body></html>
