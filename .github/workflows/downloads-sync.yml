# 로그인해야 받는 낱말 · 문법 내려받기 파일을 Supabase 비공개 저장 칸(downloads-private)에 올린다(운영자 2026-10-19 「B」).
# 자료가 바뀌어 main 에 들어가면 저절로, 또는 Actions 에서 직접 Run workflow. 열쇠(Secrets): SUPABASE_SERVICE_KEY — 쇼츠 공장과 같은 것.
# 처음 한 번은 db/add_downloads.sql 을 Supabase SQL Editor 에서 돌려야 한다. 순서는 docs/ops/downloads-gate.md.
name: downloads-sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vocab/data/**'
      - 'sentences*.js'
      - 'grammar-en.js'
      - 'tools/build-downloads.mjs'
      - 'tools/upload-downloads.mjs'

permissions:
  contents: read

concurrency: downloads-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 파일 굽기
        run: node tools/build-downloads.mjs
      - name: 비공개 저장 칸에 올리기
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node tools/upload-downloads.mjs
