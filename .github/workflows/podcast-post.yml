# 팟캐스트 자동 올리기 — 「팟캐스트 올리기」 쪽(/podcast.html)에 녹음을 올리면 30분 안에 유튜브에 올리고 스포티파이용 방송 목록(feed.xml)을 갱신한다(운영자 2026-10-19).
# 켜기: GitHub → Settings → Secrets and variables → Actions → Variables
#   PODCAST_AUTO = on            (꺼져 있으면 아무것도 안 한다 — 직접 Run workflow 는 언제든 된다)
#   YT_PRIVACY   = private(기본) | public   — 쇼츠 공장과 같은 값. 구글 심사 전에는 private 만 된다
#   PODCAST_SRT  = on            (선택 · 시험 전) Whisper 로 직접 자막을 만들어 붙인다. 없으면 유튜브 자동 자막
# 열쇠(Secrets): SUPABASE_SERVICE_KEY · YT_CLIENT_ID · YT_CLIENT_SECRET — 쇼츠 공장과 같은 것. 순서는 docs/ops/podcast-auto.md.
name: podcast-post

on:
  schedule:
    - cron: '*/30 * * * *'    # 30분마다 — 대기열이 비어 있으면 몇 초 만에 끝난다
  workflow_dispatch:
    inputs:
      what:
        description: 'post = 올리기 · dry = 영상 만들기까지만(시험) · feed = 방송 목록만 다시'
        default: 'post'

permissions:
  contents: read

concurrency: podcast-post

jobs:
  run:
    if: ${{ startsWith(vars.PODCAST_AUTO, 'on') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
      - name: Whisper(자막 — 켠 때만)
        if: ${{ startsWith(vars.PODCAST_SRT, 'on') }}
        run: pip install --quiet faster-whisper
      - name: 하기
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          PODCAST_SRT: ${{ vars.PODCAST_SRT }}
          WHAT: ${{ github.event_name == 'schedule' && 'post' || inputs.what }}
        run: |
          case "$WHAT" in
            post) node tools/podcast-post.mjs post ;;
            dry) node tools/podcast-post.mjs post --dry ;;
            feed) node tools/podcast-post.mjs feed ;;
            *) echo "what 은 post · dry · feed"; exit 1 ;;
          esac
