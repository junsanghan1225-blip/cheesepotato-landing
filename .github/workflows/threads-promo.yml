# 쓰레드 책 홍보 글 자동 올리기 — 하루 한 개, 한국 시간 21:07(유럽 오후 · 미국 아침). 운영자 요청 2026-10-27.
# 글 · 날짜: docs/ops/threads-posts.json · 그림: assets/promo/ · 열쇠: Secrets 의 THREADS_TOKEN(인스타 자동 올리기와 같은 것).
# 켜기: Settings → Secrets and variables → Actions → Variables 에 THREADS_PROMO = on (끄려면 지우거나 off).
# 같은 글은 두 번 올리지 않는다 — 올린 기록은 insta-media 가지의 promo/<번호>.json.
name: threads-promo

on:
  # GitHub 예약은 붐비면 늦거나 건너뛴다(insta-post 때 겪음) — 21:07 · 22:07 · 23:07 에 부르고, 오늘 몫을 올렸으면 뒤의 것은 바로 끝난다
  schedule:
    - cron: '7 12,13,14 * * *'
  workflow_dispatch:
    inputs:
      post:
        description: '글 번호 1~7 (비우면 오늘 올릴 차례 하나)'
        default: ''
      dry:
        description: 'yes 면 올리지 않고 글만 보여 준다(시험)'
        default: 'yes'

permissions:
  contents: write

concurrency: threads-promo

jobs:
  post:
    if: ${{ vars.THREADS_PROMO == 'on' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 기록 가지(insta-media) 열기
        run: |
          git config user.name 'cheesepotato-insta'
          git config user.email 'actions@users.noreply.github.com'
          if git fetch -q origin insta-media; then git worktree add -q ../media FETCH_HEAD && git -C ../media checkout -q -B insta-media
          else git worktree add -q --orphan -b insta-media ../media; fi
      - name: 올리기
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          ARGS="--due"; [ -n "${{ inputs.post }}" ] && ARGS="--post ${{ inputs.post }}"
          [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.dry }}" != no ] && ARGS="$ARGS --dry"
          node tools/threads-promo.mjs $ARGS --state ../media/promo
      - name: 기록 남기기
        if: ${{ always() }}
        run: |
          cd ../media && git add -A && (git diff --cached --quiet || git commit -qm "threads-promo ${{ github.run_id }}") && git push -q origin insta-media || true
