# 인스타 자동 올리기 — 하루 네 번, 그날의 게시물 하나씩(단어 1 · TOPIK · 문법 · 단어 2). 운영자 요청 2026-10-02 · TOPIK 2026-10-03.
# 켜고 끄기: GitHub → Settings → Secrets and variables → Actions → Variables 의 INSTA_AUTO 를 on 으로(끄려면 지우거나 off).
# 열쇠: 같은 곳 Secrets 의 IG_TOKEN(운영자가 직접 넣는다). 하는 일 · 순서는 docs/insta-auto.md.
# 이미지는 사이트(main)가 아니라 insta-media 가지에 올린다 — 인스타가 공개 주소에서 가져가야 해서.
name: insta-post

on:
  # 15분마다 「시간이 지났는데 아직 안 올린 게시물」이 있는지 본다(2026-10-03).
  # 정해진 시간에 한 번만 걸어 두면 GitHub 이 붐빌 때 늦추거나 아예 건너뛴다 — 10월 2~3일에 18:07 · 09:07 · 10:07 이 통째로 안 돌았고,
  # 23:07 몫은 4시간 늦게 돌았다. 할 일이 없으면 몇 초 만에 끝난다(공개 저장소라 실행 시간은 무료).
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '0 = 단어 1 · 1 = 단어 2 · 2 = 문법 · 3 = TOPIK'
        default: '0'
      day:
        description: '날짜 YYYY-MM-DD (비우면 오늘, 한국 날짜)'
        default: ''
      dry:
        description: 'yes 면 이미지만 만들고 올리지 않는다(시험)'
        default: 'yes'
      only:
        description: 'threads 면 이미 올린 게시물을 스레드에만 다시 올린다(인스타는 건드리지 않음)'
        default: ''

permissions:
  contents: write

concurrency: insta-post

jobs:
  # 1) 무엇을 올릴지 — 브라우저를 깔기 전에 가른다(할 일 없는 15분 몫은 여기서 끝)
  pick:
    if: ${{ startsWith(vars.INSTA_AUTO, 'on') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ needs.pick.outputs.slot }}
      day: ${{ needs.pick.outputs.day }}
      file: ${{ needs.pick.outputs.file }}
      dry: ${{ needs.pick.outputs.dry }}
      go: ${{ needs.pick.outputs.go }}
    steps:
      - name: 무엇을 올릴지
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file_of() { case "$1" in 0) echo 1-words ;; 1) echo 2-words ;; 2) echo 3-grammar ;; 3) echo 4-topik ;; esac; }
          posted() { [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/contents/$1/$2/posted.json?ref=insta-media")" = 200 ]; }
          if [ "${{ github.event_name }}" = schedule ]; then
            # 한국 시간 몫: 09:07 단어 1 · 13:07 TOPIK · 18:07 문법 · 23:07 단어 2. 시간이 지났고 3시간 안이며 아직 안 올린 것 하나.
            # 3시간 넘게 지났으면 그날 몫은 버린다 — 새벽에 올라가면 보는 사람이 없다.
            DAY=$(TZ=Asia/Seoul date +%F); NOW=$(( 10#$(TZ=Asia/Seoul date +%H) * 60 + 10#$(TZ=Asia/Seoul date +%M) ))
            for x in "0 547" "3 787" "2 1087" "1 1387"; do
              set -- $x; S=$1; T=$2
              if [ "$NOW" -ge "$T" ] && [ $((NOW - T)) -le 180 ] && ! posted "$DAY" "$(file_of $S)"; then
                echo "올릴 차례: $DAY $(file_of $S) (예정보다 $((NOW - T))분 늦음)"
                echo "slot=$S" >> $GITHUB_OUTPUT; echo "day=$DAY" >> $GITHUB_OUTPUT; echo "file=$(file_of $S)" >> $GITHUB_OUTPUT
                echo "dry=no" >> $GITHUB_OUTPUT; echo "go=1" >> $GITHUB_OUTPUT; exit 0
              fi
            done
            echo "지금은 올릴 것 없음"; exit 0
          fi
          SLOT='${{ inputs.slot }}'; DAY='${{ inputs.day }}'; [ -z "$DAY" ] && DAY=$(TZ=Asia/Seoul date +%F)
          FILE=$(file_of "$SLOT"); [ -z "$FILE" ] && { echo "slot 은 0~3"; exit 1; }
          echo "slot=$SLOT" >> $GITHUB_OUTPUT; echo "day=$DAY" >> $GITHUB_OUTPUT; echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "dry=${{ inputs.dry }}" >> $GITHUB_OUTPUT; echo "go=1" >> $GITHUB_OUTPUT
          echo "손으로: $DAY $FILE · 시험 ${{ inputs.dry }} · only ${{ inputs.only }}"

  # 2) 만들고 올리기
  post:
    needs: pick
    if: ${{ needs.pick.outputs.go == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 브라우저
        if: ${{ inputs.only != 'threads' }}
        run: npm i --no-save --no-package-lock playwright@1.55.0 && npx playwright install --with-deps chromium

      - name: 이미지 가지(insta-media) 열기
        run: |
          git config user.name 'cheesepotato-insta'
          git config user.email 'actions@users.noreply.github.com'
          if git fetch -q origin insta-media; then git worktree add -q ../media FETCH_HEAD && git -C ../media checkout -q -B insta-media
          else git worktree add -q --orphan -b insta-media ../media; fi

      - name: 이미 올렸으면 멈춤
        id: done
        run: |
          if [ "${{ inputs.only }}" = threads ]; then echo "스레드만 — 인스타는 건너뜀"; echo "skip=1" >> $GITHUB_OUTPUT; echo "threads=1" >> $GITHUB_OUTPUT; exit 0; fi
          if [ -f "../media/${{ needs.pick.outputs.day }}/${{ needs.pick.outputs.file }}/posted.json" ]; then echo "이미 올렸어요"; echo "skip=1" >> $GITHUB_OUTPUT; fi

      - name: 이미지 만들기
        if: ${{ !steps.done.outputs.skip }}
        run: node tools/insta-post.mjs render --slot ${{ needs.pick.outputs.slot }} --day ${{ needs.pick.outputs.day }} --out ../media

      - name: 이미지를 공개 주소로
        if: ${{ !steps.done.outputs.skip }}
        run: |
          cd ../media && git add -A && (git diff --cached --quiet || git commit -qm "insta ${{ needs.pick.outputs.day }} ${{ needs.pick.outputs.file }}") && git push -q origin insta-media
          sleep 20

      - name: 인스타에 올리기
        if: ${{ !steps.done.outputs.skip && needs.pick.outputs.dry != 'yes' }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          node tools/insta-post.mjs publish --dir ../media/${{ needs.pick.outputs.day }}/${{ needs.pick.outputs.file }} \
            --base https://raw.githubusercontent.com/${{ github.repository }}/insta-media
          cd ../media && git add -A && git commit -qm "posted ${{ needs.pick.outputs.day }} ${{ needs.pick.outputs.file }}" && git push -q origin insta-media

      # 스토리(오늘의 TOPIK 만) · 스레드 — 실패해도 인스타 피드 게시물은 이미 올라갔으므로 작업을 빨갛게 만들지 않는다
      - name: 인스타 스토리
        if: ${{ !steps.done.outputs.skip && needs.pick.outputs.dry != 'yes' }}
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          node tools/insta-post.mjs story --dir ../media/${{ needs.pick.outputs.day }}/${{ needs.pick.outputs.file }} \
            --base https://raw.githubusercontent.com/${{ github.repository }}/insta-media
          cd ../media && git add -A && (git diff --cached --quiet || git commit -qm "story ${{ needs.pick.outputs.day }}") && git push -q origin insta-media

      - name: 스레드
        if: ${{ (!steps.done.outputs.skip || steps.done.outputs.threads) && needs.pick.outputs.dry != 'yes' }}
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          node tools/insta-post.mjs threads --dir ../media/${{ needs.pick.outputs.day }}/${{ needs.pick.outputs.file }} \
            --base https://raw.githubusercontent.com/${{ github.repository }}/insta-media
          cd ../media && git add -A && (git diff --cached --quiet || git commit -qm "threads ${{ needs.pick.outputs.day }} ${{ needs.pick.outputs.file }}") && git push -q origin insta-media

      - name: 시험이면 이미지 주소 알려 주기
        if: ${{ !steps.done.outputs.skip && needs.pick.outputs.dry == 'yes' }}
        run: echo "시험 — 올리지 않았어요. 이미지 https://github.com/${{ github.repository }}/tree/insta-media/${{ needs.pick.outputs.day }}/${{ needs.pick.outputs.file }}"
