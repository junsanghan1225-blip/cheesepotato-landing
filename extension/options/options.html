<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>치즈감자 설정</title>
<link rel="stylesheet" href="../src/theme.css">
<link rel="stylesheet" href="options.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <img src="../icons/icon-48.png" alt="" width="34" height="34">
    <div>
      <h1 id="h1"></h1>
      <p class="sub" id="sub"></p>
    </div>
  </header>

  <div id="form"></div>

  <section class="card" id="bookCard">
    <h2 id="bookH"></h2>
    <p class="note" id="bookCount"></p>
    <div class="row-btns">
      <button id="exportBtn" class="btn ghost"></button>
      <button id="clearBtn" class="btn ghost danger"></button>
    </div>
  </section>

  <section class="card">
    <h2 id="keysH"></h2>
    <dl class="keys" id="keys"></dl>
  </section>

  <footer class="foot" id="foot"></footer>
</main>
<script type="module" src="options.js"></script>
</body>
</html>
